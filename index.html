<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="index,follow"><title>전자책 자료실</title><link rel="stylesheet" href="./css/style.css?v=20261014b"></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark" aria-hidden="true">A</div><div class="brand-meta"><div class="brand-kicker">DIGITAL READER</div><h1 id="siteTitle">전자책 자료실</h1></div></div><div class="sidebar-label">CONTENTS · 목차</div><nav id="chapters" class="chapters" aria-label="전자책 목차"></nav><p class="sidebar-note">목차에서 원하는 장을 선택해 읽어보세요.</p></aside><main class="main"><header class="toolbar">
<div class="toolbar-heading"><button id="menu" aria-label="목차 접기 또는 펼치기" aria-expanded="true">☰ 목차 접기</button><strong class="booktitle" id="title">전자책</strong></div>
<div class="toolbar-actions">
<div class="tool-group" role="group" aria-label="페이지 이동"><button id="firstPage" aria-label="첫 페이지로 이동" title="첫 페이지"><span aria-hidden="true">|←</span></button><button id="prev" aria-label="이전 페이지" title="이전 페이지"><span aria-hidden="true">←</span></button><label><input class="pageNumber" type="number" min="1" id="page" value="1" aria-label="페이지 번호"> <span class="page-divider">/ <span id="total">-</span></span></label><button id="next" aria-label="다음 페이지" title="다음 페이지"><span aria-hidden="true">→</span></button><button id="lastPage" aria-label="마지막 페이지로 이동" title="마지막 페이지"><span aria-hidden="true">→|</span></button></div>
<div class="tool-group" role="group" aria-label="화면 확대"><button id="zoomOut" aria-label="축소" title="축소"><span aria-hidden="true">−</span></button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="확대" title="확대"><span aria-hidden="true">＋</span></button></div>
<div class="tool-group view-group" role="group" aria-label="읽기 방식"><button id="fit" type="button" aria-pressed="false" title="화면 너비에 맞춰 보기">↔ 너비</button><button id="fitPage" type="button" aria-pressed="true" title="페이지 전체를 화면에 맞춰 보기">⛶ 전체</button><button id="spread" type="button" aria-pressed="false" title="두 페이지 나란히 보기">▣ 두 쪽</button></div>
<div class="tool-group rotation-group" role="group" aria-label="페이지 회전"><button id="rotateLeft" type="button" aria-label="반시계방향 90도 회전" title="왼쪽으로 90도 회전">↶ 90°</button><button id="rotateRight" type="button" aria-label="시계방향 90도 회전" title="오른쪽으로 90도 회전">↷ 90°</button></div>
<button id="mobileMore" type="button" aria-expanded="false" aria-controls="mobileSettings" aria-label="추가 보기 설정">⚙ 보기 설정</button>
<button id="bookmarkSave" type="button" title="현재 페이지 책갈피 저장">☆ 책갈피 저장</button><button id="resumeShortcut" type="button" hidden title="책갈피 페이지로 이동">▣ 책갈피 이동</button><button id="bookmarkDelete" type="button" hidden title="저장된 책갈피 삭제">책갈피 삭제</button>
<button id="focusMode" type="button" aria-label="집중 읽기 모드 시작" title="집중 읽기 모드">⛶ 집중 모드</button>
<a class="download hidden" id="download" href="#">원본 다운로드</a>
</div><div id="mobileSettings" class="mobile-settings" hidden>
<div class="mobile-settings-title">보기 설정 <button id="closeMobileSettings" type="button" aria-label="설정 닫기">✕</button></div>
<div class="mobile-options"><button type="button" id="mFit">↔ 너비 맞춤</button><button type="button" id="mFitPage">⛶ 전체 맞춤</button><button type="button" id="mSpread">▣ 두 쪽 보기</button><button type="button" id="mRotateLeft">↶ 왼쪽 90°</button><button type="button" id="mRotateRight">↷ 오른쪽 90°</button><button type="button" id="mFocusMode">⛶ 집중 모드 시작</button><button type="button" id="mBookmarkSave">☆ 현재 페이지 저장</button><button type="button" id="mResumeShortcut" hidden>▣ 책갈피 이동</button><button type="button" id="mBookmarkDelete" hidden>책갈피 삭제</button></div>
</div>
</header><section class="viewer" id="viewer" aria-label="전자책 열람"><button id="focusExit" class="focus-exit" type="button" hidden aria-label="집중 모드 종료">✕ 집중 모드 종료</button><div id="message" class="message">전자책을 준비하고 있습니다…</div><div class="sheets" id="sheets"></div><button id="edgePrev" class="edge-nav edge-prev" type="button" aria-label="이전 페이지" title="이전 페이지">‹</button><button id="edgeNext" class="edge-nav edge-next" type="button" aria-label="다음 페이지" title="다음 페이지">›</button></section></main></div><script type="module" src="./js/reader.js?v=20261014e"></script></body></html>
